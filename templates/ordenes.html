{% extends "layout.html" %}
{% block content %}
<h2>Gestión de Órdenes de Trabajo</h2>
<form method="POST">
    <label>Seleccionar Equipo:</label>
    <select name="equipo_id" required>
        {% for e in equipos %}<option value="{{e.id}}">{{e.tag}}</option>{% endfor %}
    </select>

    <div style="margin-top: 10px;">
        <label><b>Descripción Global de la Falla:</b></label>
        <textarea name="descripcion" placeholder="Describa globalmente la falla para el diagnóstico técnico..." 
                  style="width: 100%; height: 100px; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;" 
                  required></textarea>
    </div>

    <button type="submit" style="margin-top: 10px; padding: 10px 20px; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Abrir OT
    </button>
</form>

<table>
    <tr>
        <th>ID</th><th>Equipo</th><th>Descripción</th><th>Estado</th><th>Acción</th>
    </tr>
    {% for o in ots %}
    <tr>
        <td>{{ o.id }}</td>
        <td>{{ o.tag_equipo }}</td>
        <td>{{ o.descripcion }}</td>
        <td>{{ o.estado }}</td>
        <td><a href="/orden/{{o.id}}">Ver Seguimiento</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
